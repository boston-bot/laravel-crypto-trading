name: laravel-crypto-research

x-laravel: &laravel
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  env_file: .env
  environment:
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: 5432
    QUEUE_CONNECTION: database
    CACHE_STORE: database
    SESSION_DRIVER: database
    STRATEGY_ENGINE_DRIVER: database
    STRATEGY_ENGINE_SCHEMA_VERSION: "2.0"
    STRATEGY_ENGINE_VERSION: "0.2.0"
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped

x-public-research: &public-research
  build:
    context: backtest
  environment:
    DATABASE_URL: postgresql://postgres:postgres@postgres:5432/laravel_crypto_trading
    ENGINE_LEASE_SECONDS: 300
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: laravel_crypto_trading
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - trading-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d laravel_crypto_trading"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    <<: *laravel
    command: php artisan serve --host=0.0.0.0 --port=8000
    ports:
      - "8000:8000"

  scheduler:
    <<: *laravel
    command: php artisan schedule:work

  queue:
    <<: *laravel
    command: php artisan queue:work --tries=3 --timeout=300

  engine:
    <<: *public-research
    command: worker

  collector:
    <<: *public-research
    command: collect --products BTC-USD,ETH-USD,SOL-USD,LINK-USD,LTC-USD

volumes:
  trading-postgres:
