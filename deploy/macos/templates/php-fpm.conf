; Rendered by deploy/macos/install.sh. Dedicated pool on a private socket; the Valet pool is not touched.
[global]
pid = @@RUNTIME@@/php-fpm.pid
error_log = @@LOGS@@/php-fpm.log
daemonize = no

[investing-ops]
listen = @@RUNTIME@@/php-fpm.sock
listen.mode = 0600
pm = dynamic
pm.max_children = 4
pm.start_servers = 1
pm.min_spare_servers = 1
pm.max_spare_servers = 2
pm.max_requests = 500
request_terminate_timeout = 120s
catch_workers_output = yes
decorate_workers_output = no
clear_env = yes
; Local password-authenticated PostgreSQL: avoid macOS Kerberos/CoreFoundation calls after FPM forks.
; TLS settings are independent; never disable fork-safety protections or change other PHP pools.
env[PGGSSENCMODE] = disable
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = @@LOGS@@/php-fpm-workers.log
php_admin_value[memory_limit] = 256M
; Code changes arrive only through deploy.sh, which restarts this pool.
php_admin_value[opcache.validate_timestamps] = 0
