# Rendered by deploy/macos/install.sh. Dedicated instance; Herd and Valet configurations are not touched.
worker_processes 1;
pid @@RUNTIME@@/nginx.pid;
error_log @@LOGS@@/nginx-error.log warn;

events {
    worker_connections 256;
}

http {
    include @@NGINX_CONF_DIR@@/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;
    client_max_body_size 6m;
    client_body_temp_path @@RUNTIME@@/nginx/client_body;
    fastcgi_temp_path @@RUNTIME@@/nginx/fastcgi;
    proxy_temp_path @@RUNTIME@@/nginx/proxy;
    uwsgi_temp_path @@RUNTIME@@/nginx/uwsgi;
    scgi_temp_path @@RUNTIME@@/nginx/scgi;
    # $uri excludes query strings, so one-use OAuth callback codes never reach the access log.
    log_format private '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';
    access_log @@LOGS@@/nginx-access.log private;

    server {
        listen 127.0.0.1:@@PORT@@;
        server_name 127.0.0.1 localhost;
        root @@APP@@/public;
        index index.php;
        charset utf-8;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /index.php {
            include @@NGINX_CONF_DIR@@/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            fastcgi_pass unix:@@RUNTIME@@/php-fpm.sock;
            fastcgi_read_timeout 120s;
        }

        location ~ \.php$ {
            return 404;
        }

        location ~ /\. {
            deny all;
        }
    }
}
